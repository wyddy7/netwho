name: Deploy to Homelab

on:
  push:
    branches: [ "master", "org" ]
  # Run the lint gate on PRs too, so code is validated BEFORE it merges
  # (branch protection requires a PR but had no status check to enforce).
  # Build/deploy stay push-only — see the `if:` guards on those jobs.
  pull_request:
    branches: [ "master", "org" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # ЭТАП 1: ПРОВЕРКА КОДА (CI)
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Если есть зависимости, нужные для линтинга, можно их поставить,
          # но для flake8 обычно достаточно самого кода.

      - name: Logging gate (loguru misuse is a build error)
        # AST-based ban on logging calls that can raise (exc_info= under
        # loguru, f-string + format args). Stdlib-only, no deps.
        run: python scripts/check_logging.py

      - name: Sibling scan (exception logged without its type)
        # An exception interpolated into a log template loses its TYPE:
        # str(KeyError('x')) prints "'x'", str(httpx.ReadTimeout()) is an
        # empty string — a blank log line for a live failure. Use
        # logger.exception("static message"), or pass the value as a kwarg:
        # logger.error("failed: {err}", err=repr(e)). Brought to 0 on
        # 2026-08-19; this step keeps it at 0.
        run: |
          matches=$(grep -rnE 'log(ger)?\.(error|warning|critical)\(f?["'\''][^"'\'']*\{e\}' . --include="*.py" --exclude-dir=.venv | grep -vE 'type\(e\)|__class__|\.exception\(' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Exception interpolated into a log message without its type (see the comment on this step)."
            exit 1
          fi
          echo "sibling scan: OK"

      - name: Test the logging guard (pinned to loguru internals)
        # app/logging_guard.py patches loguru==0.7.3 private API and
        # self-verifies at startup; run its tests here so a loguru version
        # bump fails the build, not the production container.
        run: |
          pip install uv
          uv sync --frozen
          uv run pytest tests/ -q

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ------------------------------------------------------------------
  # ЭТАП 2: СБОРКА И ПУШ ОБРАЗА (CD - Build)
  # ------------------------------------------------------------------
  build-and-push:
    needs: lint
    # Never build/push from a pull_request event — only on push to a deploy
    # branch. On PRs this job (and deploy below) is skipped; lint still runs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Immutable content digest of the pushed image. Deploy pins to this
      # (not the mutable :latest tag) so a retagged image cannot be pulled.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ------------------------------------------------------------------
  # ЭТАП 3: ДЕПЛОЙ НА HOMELAB (CD - Deploy)
  # ------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d  # v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Execute remote ssh commands using key
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            # Pin to the immutable content digest built by this run, not the
            # mutable :latest tag. A retagged/poisoned :latest cannot be pulled.
            IMAGE_URL="ghcr.io/$REPO_LOWER@${{ needs.build-and-push.outputs.digest }}"

            echo "Deploying $IMAGE_URL..."

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $IMAGE_URL

            # Rollback target: the image the CURRENTLY RUNNING container uses.
            # Captured before stop/rm, and image prune is deferred until the new
            # one is verified — otherwise the prune deletes what we roll back to.
            PREV_IMAGE=$(docker inspect netwho --format '{{.Image}}' 2>/dev/null || true)
            echo "Rollback target: ${PREV_IMAGE:-<none, first deploy>}"

            # Keep the outgoing container's logs. Recreating discards them, and
            # with them the answer to "since when has this been broken".
            docker logs netwho > /tmp/netwho-predeploy-$(date +%F-%H%M%S).log 2>&1 || true

            docker stop netwho || true
            docker rm netwho || true

            docker run -d \
              --name netwho \
              --restart unless-stopped \
              --env-file /opt/apps/netwho_bot/.env \
              $IMAGE_URL

            # --- Post-deploy verification -------------------------------------
            # "docker ps says Up" is NOT a bot status: a crash-looping or deaf
            # container reports Up too. The only trustworthy signal is the
            # startup marker in the logs, plus the absence of tracebacks.
            MARKER="Bot started! Polling..."
            VERIFIED=0
            for i in $(seq 1 40); do
              if docker logs netwho 2>&1 | grep -qF "$MARKER"; then VERIFIED=1; break; fi
              if [ -z "$(docker ps -q -f name=^netwho$)" ]; then
                echo "Container is not running $i s after start (crash loop?)"
                break
              fi
              sleep 3
            done

            if [ "$VERIFIED" = "1" ]; then
              # The marker can appear and the bot still die seconds later.
              sleep 15
              # Scan for tracebacks only in the STARTUP section (up to the
              # marker). After the marker the bot is serving, and a retryable
              # application error — the recall job runs every minute and talks
              # to Supabase — is not a failed deploy. Rolling back a healthy
              # image on one transient network blip is the worse failure.
              if docker logs netwho 2>&1 | sed '/Bot started/q' \
                   | grep -q "Traceback (most recent call last)"; then
                echo "A traceback occurred during startup, before the bot began polling."
                VERIFIED=0
              elif [ -z "$(docker ps -q -f name=^netwho$)" ]; then
                echo "Startup marker found, but the container exited afterwards."
                VERIFIED=0
              fi
            fi

            if [ "$VERIFIED" != "1" ]; then
              echo "=== DEPLOY VERIFICATION FAILED — rolling back ==="
              docker logs netwho > /tmp/netwho-FAILED-$(date +%F-%H%M%S).log 2>&1 || true
              docker logs netwho --tail 60 2>&1 || true
              docker stop netwho || true
              docker rm netwho || true
              if [ -n "$PREV_IMAGE" ]; then
                echo "Restoring $PREV_IMAGE"
                docker run -d \
                  --name netwho \
                  --restart unless-stopped \
                  --env-file /opt/apps/netwho_bot/.env \
                  $PREV_IMAGE
                for i in $(seq 1 40); do
                  if docker logs netwho 2>&1 | grep -qF "$MARKER"; then
                    echo "Rollback verified: previous image is live."
                    break
                  fi
                  sleep 3
                done
              else
                echo "No previous image recorded — cannot roll back automatically."
              fi
              exit 1
            fi

            echo "Deploy verified: startup marker present, no tracebacks."
            docker image prune -f

